name: Daily Code Generator

on:
  schedule:
    # Runs daily at 04:30 UTC (10:00 AM IST)
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/generate.py

      - name: Commit and push changes
        run: |
          git config user.name "ItsDinesh-07"
          git config user.email "msddinesh072004@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs: add daily code snippet [$(date +'%Y-%m-%d')]"
          git push
