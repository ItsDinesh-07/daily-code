name: Daily Code Generator

on:
  schedule:
    # Runs daily at 04:30 UTC (10:00 AM IST)
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency:
  group: daily-code
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-daily-code:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "ItsDinesh-07"
          git config user.email "149169666+ItsDinesh-07@users.noreply.github.com"

      - name: Run code generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          PYTHONUNBUFFERED: "1"
          COMMITS_MIN: "1"
          COMMITS_MAX: "4"
        run: python scripts/generate.py

      - name: Commit and push changes
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "docs: add daily code snippet [$(date +'%Y-%m-%d')]"
          git pull --rebase
          git push
